<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Campus Vibe OTP</title>
</head>

<body style="margin:0; padding:0; background:#0f0f0f; font-family:Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0"
          style="background:#1a1a1a; margin:30px 0; padding:40px; border-radius:10px;">

          <!-- Header -->
          <tr>
            <td style="text-align:center;">
              <h1 style="color:#ff7b00; margin-bottom:10px;">Campus Vibe</h1>
              <p style="color:#bbbbbb;">Verify your email</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="color:#ffffff; font-size:16px; line-height:1.6;">
              <p>Hi 👋,</p>
              <p>Your verification code is:</p>

              <div style="text-align:center; margin:25px 0;">
                <span style="
                  display:inline-block;
                  padding:14px 32px;
                  background:#ff7b00;
                  color:#ffffff;
                  font-size:22px;
                  font-weight:bold;
                  border-radius:8px;
                  letter-spacing:4px;">
                  {{OTP}}
                </span>
              </div>

              <p>This OTP is valid for <strong>15 minutes</strong>.</p>
              <p>If you didn’t request this, you can safely ignore this email.</p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="text-align:center; padding-top:30px; color:#777; font-size:13px;">
              © 2025 Campus Vibe · All rights reserved
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
